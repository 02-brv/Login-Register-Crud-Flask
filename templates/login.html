<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 py-8 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-white p-6 rounded-lg shadow-md">
        <div class="text-center mb-6">
            <h4 class="text-2xl font-semibold">Form Login</h4>
        </div>
        <!-- Pesan Flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="mb-4">
            {% for category, message in messages %}
            <div class="alert alert-{{category}} bg-red-100 text-red-800 p-4 rounded-lg mb-4 relative">
                <strong>{{ message }}</strong>
                <button onclick="this.parentElement.style.display='none'" class="absolute top-0 right-0 p-1 text-gray-500 hover:text-gray-800">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns:xlink="http://www.w3.org/1999/xlink" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
            
        <form action="{{url_for('login')}}" method="post">
            <div class="mb-4">
                <label for="email" class="block text-sm font-medium text-gray-700">Username</label>
                <input type="email" id="email" name="email" class="mt-1 block w-full p-3 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500" placeholder="Masukkan Email" autocomplete="off" required>
            </div>

            <div class="mb-4">
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <input type="password" id="password" name="password" class="mt-1 block w-full p-3 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500" placeholder="Masukkan Password" autocomplete="off" required>
            </div>

            <div class="flex items-center justify-between">
                <button type="submit" class="w-full bg-emerald-500 text-white py-3 rounded-md shadow-md hover:bg-yellow-500 focus:outline-none">Login</button>
            </div>

            <div class="text-center mt-4">
                <p class="text-sm text-gray-600">Belum Punya Akun?  <a href="{{url_for('registrasi')}}" class="text-blue-600 hover:text-blue-700">Registrasi</a></p>
            </div>
        </form>
    </div>
</body>

</html>
