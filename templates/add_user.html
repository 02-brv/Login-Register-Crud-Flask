<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Pengguna</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans antialiased">
    <div class="w-full p-6 bg-white rounded-lg shadow-lg mt-10">
        <h1 class="text-3xl font-semibold text-gray-800 text-left mb-8">Tambah Pengguna Baru</h1>
        <form action="{{ url_for('add_user') }}" method="POST">
            <div class="mb-6">
                <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                <input type="text" name="username" class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
            </div>
            <div class="mb-6">
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                <input type="email" name="email" class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
            </div>
            <div class="mb-6">
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-2">Password</label>
                <input type="password" name="password" class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none" required>
            </div>
            <div class="mb-6">
                <label for="role" class="block text-sm font-semibold text-gray-700 mb-2">Role</label>
                <select name="role" id="role" class="mt-1 block w-full p-3 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500" required>
                    <option value="">Pilih Role</option>
                    <option value="Web developer">Web developer</option>
                    <option value="Game developer">Game developer</option>
                    <option value="Data scientist">Data scientist</option>
                    <option value="Cyber security analyst">Cyber security analyst</option>
                </select>      
            </div>
            <button type="submit" class="w-full bg-emerald-500 text-white py-3 rounded-md hover:bg-black transition duration-200">Tambah Pengguna</button>
        </form>
        <div class="mt-6 text-center">
            <a href="{{ url_for('lihat_user') }}" class="bg-emerald-500 text-white px-6 py-2 rounded hover:bg-black transition duration-200">Kembali ke Daftar Pengguna</a>
        </div>

    </div>

</body>
</html>
