<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lihat Pengguna</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans antialiased">
    <div class="w-full p-6 bg-white rounded-lg shadow-lg mt-10">
        <h1 class="text-3xl font-semibold text-gray-800 text-left mb-8">List Pengguna</h1>
        <div class="overflow-x-auto">
            <table class="min-w-full table-auto border-collapse bg-white shadow-md rounded-lg">
                <thead class="bg-emerald-500">
                    <tr>
                        <th class="py-3 px-4 text-sm font-semibold text-white">ID</th>
                        <th class="py-3 px-4 text-sm font-semibold text-white">Username</th>
                        <th class="py-3 px-4 text-sm font-semibold text-white">Email</th>
                        <th class="py-3 px-4 text-sm font-semibold text-white">Role</th>
                        <th class="py-3 px-4 text-sm font-semibold text-white text-center"></th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr class="border-b hover:bg-gray-50">
                        <td class="py-3 px-4 text-sm text-gray-700">{{ user[0] }}</td>
                        <td class="py-3 px-4 text-sm text-gray-700">{{ user[1] }}</td>
                        <td class="py-3 px-4 text-sm text-gray-700">{{ user[2] }}</td>
                        <td class="py-3 px-4 text-sm text-gray-700">{{ user[4] }}</td>
                        <td class="py-3 px-4 text-sm text-gray-700 text-center">
                            
                            <a href="{{ url_for('edit_user', id=user[0]) }}"
                                class="bg-emerald-500 text-white px-4 py-2 rounded hover:bg-black transition duration-200">Edit</a>

                            <form action="{{ url_for('delete_user', id=user[0]) }}" method="POST"
                                onsubmit="return confirm('Apakah Anda yakin ingin menghapus user ini?')"
                                class="inline-block ml-2">
                                <button type="submit"
                                    class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600 transition duration-200">Hapus</button>
                            </form>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% if editing %}
        <div class="bg-white p-6 rounded-lg shadow-lg mt-10">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Edit Pengguna</h2>
            <form action="{{ url_for('edit_user', id=user[0]) }}" method="POST">
                <div class="mb-6">
                    <label for="username" class="block text-sm font-semibold text-gray-700 mb-2">Username</label>
                    <input type="text" name="username" value="{{ user[1] }}"
                        class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="mb-6">
                    <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">Email</label>
                    <input type="email" name="email" value="{{ user[2] }}"
                        class="w-full p-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>
                <div class="mb-6">
                    <label for="role" class="block text-sm font-semibold text-gray-700 mb-2">Role</label>
                    <select name="role" id="role"
                        class="mt-1 block w-full p-3 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                        required>
                        <option value="">Pilih Role</option>
                        <option value="Web developer">Web developer</option>
                        <option value="Game developer">Game developer</option>
                        <option value="Data scientist">Data scientist</option>
                        <option value="Cyber security analyst">Cyber security analyst</option>
                    </select>
                </div>
                <button type="submit"
                    class="w-full bg-emerald-500 text-white py-3 rounded-md hover:bg-yellow-500 transition duration-200">Update</button>
            </form>
        </div>
        {% endif %}
        <div class="mt-6 flex justify-start">
            <a href="{{ url_for('index') }}"
                class="bg-emerald-500 text-white px-6 py-2 rounded hover:bg-black transition duration-200">Halaman
                Utama</a>
            <a href="{{ url_for('lihat_user') }}"
                class="bg-emerald-500 text-white px-6 py-2 rounded hover:bg-black transition duration-200 ml-4">Lihat
                User</a>
            <a href="{{ url_for('add_user') }}"
                class="bg-emerald-500 text-white px-6 py-2 rounded hover:bg-black transition duration-200 ml-4">Tambah
                Data</a>
        </div>

    </div>

</body>

</html>
